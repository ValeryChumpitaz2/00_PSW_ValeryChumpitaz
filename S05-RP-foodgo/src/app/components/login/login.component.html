<div class="login-page"> <div class="login-overlay"></div> <div class="login-card">
<div class="brand">
  <div class="brand-icon">🍔</div>

  <div class="brand-text">
    <h1>FoodGo</h1>
    <span>Tu comida favorita, donde quieras</span>
  </div>
</div>

<div class="login-header">
  <h2>¡Bienvenido!</h2>
  <p>Inicia sesión para continuar</p>
</div>

<form
  class="login-form"
  (ngSubmit)="login()"
>

  <div class="form-group">
    <label for="email">
      Correo electrónico
    </label>

    <div class="input-wrapper">
      <span class="input-icon">✉</span>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="Ingresa tu correo"
        autocomplete="email"
        required
      />
    </div>
  </div>

  <div class="form-group">
    <label for="password">
      Contraseña
    </label>

    <div class="input-wrapper">
      <span class="input-icon">🔒</span>

      <input
        id="password"
        name="password"
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
        autocomplete="current-password"
        required
      />

      <button
        type="button"
        class="show-password"
        (click)="togglePassword()"
      >
        {{ showPassword ? 'Ocultar' : 'Ver' }}
      </button>
    </div>
  </div>

  <div
    class="error-message"
    *ngIf="errorMessage"
  >
    <span>⚠</span>
    <span>{{ errorMessage }}</span>
  </div>

  <button
    type="submit"
    class="login-button"
    [disabled]="isLoading"
  >
    <span *ngIf="!isLoading">
      Iniciar sesión
    </span>

    <span *ngIf="isLoading">
      Ingresando...
    </span>
  </button>

</form>

<div class="demo-box">

  <div class="demo-title">
    🔑 Credenciales de prueba
  </div>

  <div class="demo-row">
    <span>Correo</span>
<strong>admin&#64;foodgo.com</strong>
  </div>

  <div class="demo-row">
    <span>Contraseña</span>
    <strong>admin123</strong>
  </div>

</div>

<div class="login-footer">
  <p>© 2026 FoodGo</p>
  <p>Deliciosa comida, estés donde estés.</p>
</div>

</div> </div>
